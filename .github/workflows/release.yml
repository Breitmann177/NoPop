# New version: update VERSION, then push a tag like v1.1.0 – GitHub builds and publishes the release.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Build ZIP
        run: python packaging/build.py
      - name: Build Setup.exe
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$v" packaging\nopop.iss
          Get-FileHash dist\NoPop-Setup.exe, dist\NoPop-$v-windows-x64.zip | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: NoPop
          path: |
            dist/NoPop-Setup.exe
            dist/NoPop-*-windows-x64.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          $notes = @"
          ### Download
          **[NoPop-Setup.exe](https://github.com/${{ github.repository }}/releases/latest/download/NoPop-Setup.exe)** → double-click → done. No admin rights needed.

          If Windows says *"Windows protected your PC"*: **More info → Run anyway** (NoPop is free and not signed with a paid certificate).
          Setup blocked by *Smart App Control*? Use the ZIP instead: extract → double-click **Install.cmd**.

          **Deutsch:** Setup herunterladen → doppelklicken → fertig. Bei der Windows-Warnung: **Weitere Informationen → Trotzdem ausführen**.

          Uninstall: Settings → Apps → NoPop.
          "@
          gh release create $env:GITHUB_REF_NAME dist/NoPop-Setup.exe "dist/NoPop-$v-windows-x64.zip" --title "NoPop $v" --notes $notes
